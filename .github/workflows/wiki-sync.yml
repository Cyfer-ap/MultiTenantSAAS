name: Wiki Sync

on:
  pull_request:
    branches:
      - main
    paths:
      - 'wiki/**'
      - 'scripts/publish-wiki.ps1'
      - '.github/workflows/wiki-sync.yml'
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
      - 'scripts/publish-wiki.ps1'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

concurrency:
  group: wiki-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate Wiki Source
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate canonical Wiki source and publisher
        shell: pwsh
        run: .\scripts\publish-wiki.ps1 -NoPush

  publish:
    name: Publish GitHub Wiki
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Wiki commit identity
        shell: pwsh
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish canonical Wiki source
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\scripts\publish-wiki.ps1
