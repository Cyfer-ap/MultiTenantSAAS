name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed files for whitespace errors
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check \
              "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            git diff --check HEAD^ HEAD
          fi


  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: multitenant-saas

    env:
      JWT_SECRET: ci-jwt-secret-key-that-is-at-least-32-bytes-long

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: multitenant-saas/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build, test and verify backend
        run: ./mvnw --batch-mode verify

      - name: Upload backend test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-and-coverage-reports
          path: |
            multitenant-saas/target/surefire-reports/
            multitenant-saas/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload backend application artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: multitenant-saas/target/*.jar
          if-no-files-found: error
          retention-days: 7


  database:
    name: PostgreSQL and Flyway
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: multitenant-saas

    env:
      JWT_SECRET: ci-jwt-secret-key-that-is-at-least-32-bytes-long

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: multitenant-saas/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Validate PostgreSQL schema and Flyway migrations
        run: >
          ./mvnw --batch-mode
          "-Dtest=PostgreSqlSchemaIntegrationTest"
          test

      - name: Upload PostgreSQL test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-flyway-test-report
          path: multitenant-saas/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7


  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: multitenant-saas-frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: multitenant-saas-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend formatting
        run: npm run format:check

      - name: Run frontend tests with coverage
        run: npm run test:coverage

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: multitenant-saas-frontend/coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload frontend production build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: multitenant-saas-frontend/dist/
          if-no-files-found: error
          retention-days: 7