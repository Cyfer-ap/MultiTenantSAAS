name: Auto Format

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  format:
    name: Apply formatting
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: multitenant-saas/pom.xml

      - name: Make Maven wrapper executable
        working-directory: multitenant-saas
        run: chmod +x mvnw

      - name: Format backend
        working-directory: multitenant-saas
        run: ./mvnw --batch-mode spotless:apply

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: multitenant-saas-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: multitenant-saas-frontend
        run: npm ci

      - name: Format frontend
        working-directory: multitenant-saas-frontend
        run: npm run format

      - name: Check for formatting changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit formatting changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style: apply automated formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
