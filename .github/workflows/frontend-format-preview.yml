name: Frontend Format Preview

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: multitenant-saas-frontend
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: multitenant-saas-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply MUI v9 compatibility fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/OutboundWebhooksPage.tsx')
          text = path.read_text()
          replacements = [
              ("inputProps={{ readOnly: true }}", "slotProps={{ input: { readOnly: true } }}"),
              ('<Stack alignItems="center" sx={{ p: 4 }}>', "<Stack sx={{ alignItems: 'center', p: 4 }}>") ,
              ('<Stack direction="row" flexWrap="wrap" gap={0.5}>', "<Stack direction=\"row\" sx={{ flexWrap: 'wrap', gap: 0.5 }}>") ,
              ('<Stack direction="row" justifyContent="flex-end" spacing={0.5}>', "<Stack direction=\"row\" spacing={0.5} sx={{ justifyContent: 'flex-end' }}>") ,
              ("endpointById.get(deliveryQuery.data.delivery.endpointId)?.enabled === false", "endpointById.get(deliveryQuery.data.delivery.endpointId)?.enabled !== true"),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected source fragment not found: {old}')
              text = text.replace(old, new)

          path.write_text(text)
          PY

      - name: Format frontend
        run: npm run format

      - name: Commit page fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/OutboundWebhooksPage.tsx
          if ! git diff --cached --quiet; then
            git commit -m "fix: align webhook admin page with MUI v9"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Verify frontend build
        run: npm run build
