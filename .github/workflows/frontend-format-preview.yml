name: Frontend Format Preview

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: multitenant-saas-frontend
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: multitenant-saas-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply MUI v9 compatibility fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/pages/OutboundWebhooksPage.tsx')
          text = path.read_text()

          substitutions = [
              (r'inputProps=\{\{\s*readOnly:\s*true\s*\}\}', "slotProps={{ input: { readOnly: true } }}", 1),
              (r'<Stack\s+alignItems="center"\s+sx=\{\{\s*p:\s*4\s*\}\}\s*>', "<Stack sx={{ alignItems: 'center', p: 4 }}>", 3),
              (r'<Stack\s+direction="row"\s+flexWrap="wrap"\s+gap=\{0\.5\}\s*>', "<Stack direction=\"row\" sx={{ flexWrap: 'wrap', gap: 0.5 }}>", 1),
              (r'<Stack\s+direction="row"\s+justifyContent="flex-end"\s+spacing=\{0\.5\}\s*>', "<Stack direction=\"row\" spacing={0.5} sx={{ justifyContent: 'flex-end' }}>", 1),
              (r'endpointById\.get\(\s*deliveryQuery\.data\.delivery\.endpointId\s*\)\?\.enabled\s*===\s*false', "endpointById.get(deliveryQuery.data.delivery.endpointId)?.enabled !== true", 1),
          ]

          for pattern, replacement, expected in substitutions:
              text, count = re.subn(pattern, replacement, text)
              if count != expected:
                  raise SystemExit(
                      f'Expected {expected} replacement(s) for {pattern!r}, found {count}'
                  )

          path.write_text(text)
          PY

      - name: Format frontend
        run: npm run format

      - name: Commit page fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/OutboundWebhooksPage.tsx
          if ! git diff --cached --quiet; then
            git commit -m "fix: align webhook admin page with MUI v9"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Verify frontend build
        run: npm run build
