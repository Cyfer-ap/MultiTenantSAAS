name: Frontend Format Preview

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: multitenant-saas-frontend
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: multitenant-saas-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Harden replay availability
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/pages/OutboundWebhooksPage.tsx')
          text = path.read_text()
          pattern = r'endpointById\.get\(\s*deliveryQuery\.data\.delivery\.endpointId\s*\)\s*\?\.enabled\s*===\s*false'
          replacement = "endpointById.get(deliveryQuery.data.delivery.endpointId)?.enabled !== true"
          text, count = re.subn(pattern, replacement, text)
          if count != 1:
              raise SystemExit(f'Expected one replay guard replacement, found {count}')
          path.write_text(text)
          PY

      - name: Format frontend
        run: npm run format

      - name: Commit replay guard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/OutboundWebhooksPage.tsx
          if ! git diff --cached --quiet; then
            git commit -m "fix: disable replay for unavailable webhook endpoints"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Verify frontend build
        run: npm run build
