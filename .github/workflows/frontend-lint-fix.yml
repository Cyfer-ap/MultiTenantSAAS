name: Frontend Lint Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: multitenant-saas-frontend
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: multitenant-saas-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Remove effect-driven dialog state synchronization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/pages/OutboundWebhooksPage.tsx')
          text = path.read_text()

          text, count = re.subn(
              r"import \{ useEffect, useMemo, useState \} from 'react'",
              "import { useMemo, useState } from 'react'",
              text,
          )
          if count != 1:
              raise SystemExit(f'Expected one React import replacement, found {count}')

          endpoint_pattern = re.compile(
              r"    const \[name, setName\] = useState\(''\)\n"
              r"    const \[url, setUrl\] = useState\(''\)\n"
              r"    const \[enabled, setEnabled\] = useState\(true\)\n"
              r"    const \[events, setEvents\] = useState<OutboundWebhookEventType\[\]>\(\[\]\)\n\n"
              r"    useEffect\(\(\) => \{\n"
              r"        if \(!open\) \{\n"
              r"            return\n"
              r"        \}\n\n"
              r"        setName\(endpoint\?\.name \?\? ''\)\n"
              r"        setUrl\(endpoint\?\.url \?\? ''\)\n"
              r"        setEnabled\(endpoint\?\.enabled \?\? true\)\n"
              r"        setEvents\(endpoint\?\.events \?\? \[\]\)\n"
              r"    \}, \[endpoint, open\]\)"
          )
          endpoint_replacement = """    const [name, setName] = useState(endpoint?.name ?? '')
              const [url, setUrl] = useState(endpoint?.url ?? '')
              const [enabled, setEnabled] = useState(endpoint?.enabled ?? true)
              const [events, setEvents] = useState<OutboundWebhookEventType[]>(endpoint?.events ?? [])"""
          text, count = endpoint_pattern.subn(endpoint_replacement, text)
          if count != 1:
              raise SystemExit(f'Expected one endpoint dialog state replacement, found {count}')

          secret_pattern = re.compile(
              r"    const \[copied, setCopied\] = useState\(false\)\n\n"
              r"    useEffect\(\(\) => \{\n"
              r"        if \(open\) \{\n"
              r"            setCopied\(false\)\n"
              r"        \}\n"
              r"    \}, \[open\]\)"
          )
          text, count = secret_pattern.subn(
              "    const [copied, setCopied] = useState(false)",
              text,
          )
          if count != 1:
              raise SystemExit(f'Expected one secret dialog effect replacement, found {count}')

          text, count = re.subn(
              r"            <EndpointDialog\n",
              "            <EndpointDialog\n                key={endpointDialogOpen ? (editingEndpoint?.id ?? 'new') : 'closed'}\n",
              text,
          )
          if count != 1:
              raise SystemExit(f'Expected one EndpointDialog key insertion, found {count}')

          text, count = re.subn(
              r"            <SecretDialog\n",
              "            <SecretDialog\n                key={secret || 'closed-secret'}\n",
              text,
          )
          if count != 1:
              raise SystemExit(f'Expected one SecretDialog key insertion, found {count}')

          path.write_text(text)
          PY

      - name: Format frontend
        run: npm run format

      - name: Commit lint fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/OutboundWebhooksPage.tsx
          if ! git diff --cached --quiet; then
            git commit -m "fix: avoid effect-driven webhook dialog state"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Verify frontend lint
        run: npm run lint

      - name: Verify frontend build
        run: npm run build
