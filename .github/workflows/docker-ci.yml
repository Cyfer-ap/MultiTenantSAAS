name: Container CI

on:
  workflow_dispatch:

  pull_request:
    paths:
      - "multitenant-saas/**"
      - "multitenant-saas-frontend/**"
      - "compose.yaml"
      - ".github/workflows/docker-ci.yml"

  push:
    branches:
      - main
    paths:
      - "multitenant-saas/**"
      - "multitenant-saas-frontend/**"
      - "compose.yaml"
      - ".github/workflows/docker-ci.yml"

concurrency:
  group: container-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  compose:
    name: Compose Validation
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: ci-only-secret-not-used-at-runtime

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet


  backend-image:
    name: Backend Container
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build backend image
        uses: docker/build-push-action@v7.2.0
        with:
          context: ./multitenant-saas
          push: false
          load: true
          tags: multitenant-saas-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: multitenant-saas-backend:ci
          scanners: "vuln"
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"


  frontend-image:
    name: Frontend Container
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build frontend image
        uses: docker/build-push-action@v7.2.0
        with:
          context: ./multitenant-saas-frontend
          push: false
          load: true
          tags: multitenant-saas-frontend:ci
          build-args: |
            VITE_API_BASE_URL=http://localhost:8081
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: multitenant-saas-frontend:ci
          scanners: "vuln"
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"
