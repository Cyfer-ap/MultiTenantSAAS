name: Spotless Preview

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: multitenant-saas
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: multitenant-saas/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Apply backend formatting
        run: ./mvnw --batch-mode spotless:apply

      - name: Capture formatting diff
        shell: bash
        run: git diff -- src/main/java src/test/java > ../spotless.patch

      - name: Upload formatting diff
        uses: actions/upload-artifact@v4
        with:
          name: spotless-formatting-diff
          path: spotless.patch
          retention-days: 1
