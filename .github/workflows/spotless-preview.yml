name: Spotless Preview

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: multitenant-saas
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: multitenant-saas/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Apply backend formatting
        run: ./mvnw --batch-mode spotless:apply

      - name: Upload formatted Java sources
        uses: actions/upload-artifact@v4
        with:
          name: spotless-formatted-java
          path: |
            multitenant-saas/src/main/java/
            multitenant-saas/src/test/java/
          retention-days: 1
