name: multitenant-saas

services:

  postgres:
    image: postgres:17-alpine

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-multitenant_saas}
      POSTGRES_USER: ${POSTGRES_USERNAME:-multitenant_saas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multitenant_saas}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

    networks:
      - app-network


  backend:
    build:
      context: ./multitenant-saas

    image: multitenant-saas-backend:local

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: postgres

      SERVER_PORT: 8081

      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-multitenant_saas}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-multitenant_saas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multitenant_saas}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}

      PASSWORD_RESET_EXPOSE_TOKEN: "false"

      MAIL_PROVIDER: "${MAIL_PROVIDER:-logging}"
      MAIL_FROM_EMAIL: "${MAIL_FROM_EMAIL:-}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-MultiTenant SaaS}"
      BREVO_API_KEY: "${BREVO_API_KEY:-}"
      BREVO_BASE_URL: "${BREVO_BASE_URL:-https://api.brevo.com/v3}"

      NOTIFICATION_DELIVERY_ENABLED: "${NOTIFICATION_DELIVERY_ENABLED:-false}"
      NOTIFICATION_DELIVERY_BATCH_SIZE: "${NOTIFICATION_DELIVERY_BATCH_SIZE:-50}"
      NOTIFICATION_DELIVERY_MAX_ATTEMPTS: "${NOTIFICATION_DELIVERY_MAX_ATTEMPTS:-5}"
      NOTIFICATION_DELIVERY_PROCESSING_TIMEOUT: "${NOTIFICATION_DELIVERY_PROCESSING_TIMEOUT:-5m}"
      NOTIFICATION_DELIVERY_RETRY_BASE_DELAY: "${NOTIFICATION_DELIVERY_RETRY_BASE_DELAY:-30s}"
      NOTIFICATION_DELIVERY_RETRY_MAX_DELAY: "${NOTIFICATION_DELIVERY_RETRY_MAX_DELAY:-1h}"
      NOTIFICATION_FRONTEND_BASE_URL: "${NOTIFICATION_FRONTEND_BASE_URL:-http://localhost:8080}"

      STORAGE_PROVIDER: "${STORAGE_PROVIDER:-disabled}"
      R2_ENDPOINT: "${R2_ENDPOINT:-}"
      R2_BUCKET: "${R2_BUCKET:-}"
      R2_REGION: "${R2_REGION:-auto}"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:-}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:-}"
      R2_UPLOAD_URL_EXPIRATION_MINUTES: "${R2_UPLOAD_URL_EXPIRATION_MINUTES:-10}"
      R2_DOWNLOAD_URL_EXPIRATION_MINUTES: "${R2_DOWNLOAD_URL_EXPIRATION_MINUTES:-5}"

      STRIPE_BILLING_ENABLED: "${STRIPE_BILLING_ENABLED:-false}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_BASE_URL: "${STRIPE_BASE_URL:-https://api.stripe.com}"
      STRIPE_SUCCESS_URL: "${STRIPE_SUCCESS_URL:-http://localhost:8080/subscription?checkout=success}"
      STRIPE_CANCEL_URL: "${STRIPE_CANCEL_URL:-http://localhost:8080/subscription?checkout=cancelled}"
      STRIPE_WEBHOOK_ENABLED: "${STRIPE_WEBHOOK_ENABLED:-false}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      STRIPE_WEBHOOK_TOLERANCE_SECONDS: "${STRIPE_WEBHOOK_TOLERANCE_SECONDS:-300}"
      STRIPE_PRICE_FREE: "${STRIPE_PRICE_FREE:-}"
      STRIPE_PRICE_PRO: "${STRIPE_PRICE_PRO:-}"
      STRIPE_PRICE_ENTERPRISE: "${STRIPE_PRICE_ENTERPRISE:-}"

      RAZORPAY_BILLING_ENABLED: "${RAZORPAY_BILLING_ENABLED:-false}"
      RAZORPAY_KEY_ID: "${RAZORPAY_KEY_ID:-}"
      RAZORPAY_KEY_SECRET: "${RAZORPAY_KEY_SECRET:-}"
      RAZORPAY_BASE_URL: "${RAZORPAY_BASE_URL:-https://api.razorpay.com}"
      RAZORPAY_WEBHOOK_ENABLED: "${RAZORPAY_WEBHOOK_ENABLED:-false}"
      RAZORPAY_WEBHOOK_SECRET: "${RAZORPAY_WEBHOOK_SECRET:-}"
      RAZORPAY_SUBSCRIPTION_TOTAL_COUNT: "${RAZORPAY_SUBSCRIPTION_TOTAL_COUNT:-120}"
      RAZORPAY_PLAN_FREE: "${RAZORPAY_PLAN_FREE:-}"
      RAZORPAY_PLAN_PRO: "${RAZORPAY_PLAN_PRO:-}"
      RAZORPAY_PLAN_ENTERPRISE: "${RAZORPAY_PLAN_ENTERPRISE:-}"

      SYSTEM_ADMIN_BOOTSTRAP_ENABLED: ${SYSTEM_ADMIN_BOOTSTRAP_ENABLED:-false}
      SYSTEM_ADMIN_BOOTSTRAP_FULL_NAME: ${SYSTEM_ADMIN_BOOTSTRAP_FULL_NAME:-}
      SYSTEM_ADMIN_BOOTSTRAP_EMAIL: ${SYSTEM_ADMIN_BOOTSTRAP_EMAIL:-}
      SYSTEM_ADMIN_BOOTSTRAP_PASSWORD: ${SYSTEM_ADMIN_BOOTSTRAP_PASSWORD:-}

    ports:
      - "${BACKEND_PORT:-8081}:8081"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "http://127.0.0.1:8081/readyz"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    networks:
      - app-network


  frontend:
    build:
      context: ./multitenant-saas-frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8081}

    image: multitenant-saas-frontend:local

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "${FRONTEND_PORT:-8080}:8080"

    networks:
      - app-network


volumes:
  postgres_data:


networks:
  app-network:
    driver: bridge
