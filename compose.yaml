name: multitenant-saas

services:

  postgres:
    image: postgres:17-alpine

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-multitenant_saas}
      POSTGRES_USER: ${POSTGRES_USERNAME:-multitenant_saas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multitenant_saas}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

    networks:
      - app-network


  backend:
    build:
      context: ./multitenant-saas

    image: multitenant-saas-backend:local

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: postgres

      SERVER_PORT: 8081

      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-multitenant_saas}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-multitenant_saas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multitenant_saas}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}

      PASSWORD_RESET_EXPOSE_TOKEN: "false"

      MAIL_PROVIDER: "${MAIL_PROVIDER:-logging}"
      MAIL_FROM_EMAIL: "${MAIL_FROM_EMAIL:-}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-MultiTenant SaaS}"
      BREVO_API_KEY: "${BREVO_API_KEY:-}"
      BREVO_BASE_URL: "${BREVO_BASE_URL:-https://api.brevo.com/v3}"

      SYSTEM_ADMIN_BOOTSTRAP_ENABLED: ${SYSTEM_ADMIN_BOOTSTRAP_ENABLED:-false}
      SYSTEM_ADMIN_BOOTSTRAP_FULL_NAME: ${SYSTEM_ADMIN_BOOTSTRAP_FULL_NAME:-}
      SYSTEM_ADMIN_BOOTSTRAP_EMAIL: ${SYSTEM_ADMIN_BOOTSTRAP_EMAIL:-}
      SYSTEM_ADMIN_BOOTSTRAP_PASSWORD: ${SYSTEM_ADMIN_BOOTSTRAP_PASSWORD:-}

    ports:
      - "${BACKEND_PORT:-8081}:8081"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "http://127.0.0.1:8081/readyz"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    networks:
      - app-network


  frontend:
    build:
      context: ./multitenant-saas-frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8081}

    image: multitenant-saas-frontend:local

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "${FRONTEND_PORT:-8080}:8080"

    networks:
      - app-network


volumes:
  postgres_data:


networks:
  app-network:
    driver: bridge
