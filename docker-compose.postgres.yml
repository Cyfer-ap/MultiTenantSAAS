services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: multitenant_saas
      POSTGRES_USER: multitenant_saas
      POSTGRES_PASSWORD: multitenant_saas
    ports:
      - "5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U multitenant_saas -d multitenant_saas
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - multitenant_saas_postgres:/var/lib/postgresql/data

volumes:
  multitenant_saas_postgres:
