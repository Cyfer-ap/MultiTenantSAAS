# PostgreSQL profile for production-like and deployment environments.
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/multitenant_saas}
spring.datasource.username=${POSTGRES_USERNAME:multitenant_saas}
spring.datasource.password=${POSTGRES_PASSWORD:multitenant_saas}
spring.datasource.driver-class-name=org.postgresql.Driver

# PostgreSQL never exposes the H2 console.
spring.h2.console.enabled=false

# V1-V17 are represented by a PostgreSQL-native current-schema baseline.
# All future portable migrations start at V18 in db/common.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/postgresql,classpath:db/common
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

# Flyway owns the schema; Hibernate verifies that mappings still match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
