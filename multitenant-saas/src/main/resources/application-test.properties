# Separate in-memory test database
spring.datasource.url=jdbc:h2:mem:multitenant_saas_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate validates the schema created by Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Run real migrations in tests
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/common
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false

# H2 console is unnecessary during automated tests
spring.h2.console.enabled=false

# Safe test-only JWT secret
app.jwt.secret=test-jwt-secret-key-that-is-at-least-32-bytes-long
app.jwt.expiration-minutes=60
app.jwt.issuer=multitenant-saas-test

# Test token settings
app.refresh-token.expiration-days=7
app.password-reset.expiration-minutes=15
app.password-reset.expose-token=true

# Create a system admin inside the isolated test database
app.system-admin.bootstrap.enabled=true
app.system-admin.bootstrap.full-name=Test System Admin
app.system-admin.bootstrap.email=system.test@saas.local
app.system-admin.bootstrap.password=TestSystemAdmin@123

# Security
app.security.max-failed-login-attempts=5
app.security.account-lock-minutes=15
app.security.public-rate-limit.enabled=false

# Non-auth integration suites use direct tenant-login fixtures.
# Dedicated auth-hardening unit tests construct the service with this gate enabled.
app.auth.email-verification.require-login-grant=false

# Invitations
app.user-invitation.expiration-hours=48

# CORS
app.cors.allowed-origins=http://localhost:3000