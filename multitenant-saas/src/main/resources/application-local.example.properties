spring.datasource.url=jdbc:h2:file:./data/multitenant_saas_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
management.endpoint.health.show-details=always

app.jwt.secret=GENERATE_A_RANDOM_SECRET_OF_AT_LEAST_32_BYTES

# Local-only convenience: never enable raw reset-token exposure in production.
app.password-reset.expose-token=true

app.system-admin.bootstrap.enabled=true
app.system-admin.bootstrap.full-name=System Admin
app.system-admin.bootstrap.email=system@saas.local
app.system-admin.bootstrap.password=CHOOSE_A_STRONG_LOCAL_PASSWORD

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173