# =========================================================
# Production runtime hardening
# =========================================================

# Render terminates TLS at its load balancer and forwards the original request metadata.
# Let Tomcat resolve X-Forwarded-* values so request.getRemoteAddr() and secure-request
# detection use the external client/protocol rather than the Render proxy hop.
server.forward-headers-strategy=NATIVE

# Developer-only browser surfaces are disabled in production.
spring.h2.console.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Tenant password login must follow verified email/workspace discovery.
app.auth.email-verification.require-login-grant=true

# Browser refresh/trusted-device credentials must be HttpOnly Secure cookies in production.
app.auth.browser-session.cookie-mode=${AUTH_BROWSER_COOKIE_MODE:true}
app.auth.browser-session.secure=${AUTH_COOKIE_SECURE:true}
app.auth.browser-session.partitioned=${AUTH_COOKIE_PARTITIONED:true}
app.auth.browser-session.same-site=${AUTH_COOKIE_SAME_SITE:None}

# Never expose internal exception details through HTTP responses.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Hibernate sessions must remain inside explicit transaction boundaries.
spring.jpa.open-in-view=false

# Database schema changes are owned exclusively by Flyway.
spring.jpa.hibernate.ddl-auto=validate

# Flyway clean must never be available in production.
spring.flyway.clean-disabled=true

# =========================================================
# Actuator
# =========================================================

# Health remains public; info and metrics are restricted to SYSTEM_ADMIN by SecurityConfig.
management.endpoints.web.exposure.include=health,info,metrics

# Health checks must not leak database or internal component details.
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Kubernetes/container-compatible probes.
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true

# =========================================================
# Logging
# =========================================================

# Include the per-request correlation id in production logs.
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId:-none}] %logger{36} - %msg%n

logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# Avoid accidental verbose security logging.
logging.level.org.springframework.security=INFO
