# =========================================================
# Production runtime hardening
# =========================================================

# Never expose internal exception details through HTTP responses.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Hibernate sessions must remain inside explicit transaction boundaries.
spring.jpa.open-in-view=false

# Database schema changes are owned exclusively by Flyway.
spring.jpa.hibernate.ddl-auto=validate

# Flyway clean must never be available in production.
spring.flyway.clean-disabled=true

# =========================================================
# Actuator
# =========================================================

# Health remains public; info and metrics are restricted to SYSTEM_ADMIN by SecurityConfig.
management.endpoints.web.exposure.include=health,info,metrics

# Health checks must not leak database or internal component details.
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Kubernetes/container-compatible probes.
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true

# =========================================================
# Logging
# =========================================================

# Include the per-request correlation id in production logs.
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId:-none}] %logger{36} - %msg%n

logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# Avoid accidental verbose security logging.
logging.level.org.springframework.security=INFO
