spring.application.name=multitenant-saas

server.port=${SERVER_PORT:8081}
server.shutdown=graceful
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:NONE}
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:20s}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/common
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false

# H2 console must remain disabled unless a local profile enables it
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.jwt.issuer=${JWT_ISSUER:multitenant-saas}

# Refresh tokens
# Session refresh credentials disappear when the browser closes.
app.refresh-token.session-expiration-hours=${REFRESH_TOKEN_SESSION_EXPIRATION_HOURS:12}
# Persistent refresh credentials are used only when "Keep me signed in" is selected.
app.refresh-token.persistent-expiration-days=${REFRESH_TOKEN_PERSISTENT_EXPIRATION_DAYS:30}

# Browser session cookies
app.auth.browser-session.cookie-mode=${AUTH_BROWSER_COOKIE_MODE:true}
app.auth.browser-session.secure=${AUTH_COOKIE_SECURE:false}
app.auth.browser-session.partitioned=${AUTH_COOKIE_PARTITIONED:false}
app.auth.browser-session.same-site=${AUTH_COOKIE_SAME_SITE:Lax}

# Password reset
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:15}
app.password-reset.expose-token=${PASSWORD_RESET_EXPOSE_TOKEN:false}
app.password-reset.frontend-base-url=${PASSWORD_RESET_FRONTEND_BASE_URL:http://localhost:8080}

# System-admin bootstrap
app.system-admin.bootstrap.enabled=${SYSTEM_ADMIN_BOOTSTRAP_ENABLED:false}
app.system-admin.bootstrap.full-name=${SYSTEM_ADMIN_BOOTSTRAP_FULL_NAME:}
app.system-admin.bootstrap.email=${SYSTEM_ADMIN_BOOTSTRAP_EMAIL:}
app.system-admin.bootstrap.password=${SYSTEM_ADMIN_BOOTSTRAP_PASSWORD:}

# Login security
app.security.max-failed-login-attempts=${MAX_FAILED_LOGIN_ATTEMPTS:5}
app.security.account-lock-minutes=${ACCOUNT_LOCK_MINUTES:15}

# Email-first workspace discovery
# A dedicated secret is recommended in production. JWT_SECRET is a safe deployment fallback.
app.auth.email-verification.expiration-minutes=${EMAIL_VERIFICATION_EXPIRATION_MINUTES:10}
app.auth.email-verification.max-attempts=${EMAIL_VERIFICATION_MAX_ATTEMPTS:5}
app.auth.email-verification.trusted-browser-days=${EMAIL_VERIFICATION_TRUSTED_BROWSER_DAYS:30}
app.auth.email-verification.secret=${EMAIL_VERIFICATION_SECRET:${JWT_SECRET}}

# Public authentication abuse protection. This limiter is process-local;
# use a shared store when the application is horizontally scaled.
app.security.public-rate-limit.enabled=${PUBLIC_RATE_LIMIT_ENABLED:true}
app.security.public-rate-limit.window-seconds=${PUBLIC_RATE_LIMIT_WINDOW_SECONDS:60}
app.security.public-rate-limit.login-max-requests=${PUBLIC_RATE_LIMIT_LOGIN_MAX_REQUESTS:30}
app.security.public-rate-limit.recovery-max-requests=${PUBLIC_RATE_LIMIT_RECOVERY_MAX_REQUESTS:10}
app.security.public-rate-limit.token-max-requests=${PUBLIC_RATE_LIMIT_TOKEN_MAX_REQUESTS:120}
app.security.public-rate-limit.onboarding-max-requests=${PUBLIC_RATE_LIMIT_ONBOARDING_MAX_REQUESTS:10}

# Invitations
app.user-invitation.expiration-hours=${USER_INVITATION_EXPIRATION_HOURS:48}

# Transactional email
# Keep logging as the safe default for local development and automated tests.
app.mail.provider=${MAIL_PROVIDER:logging}
app.mail.from-email=${MAIL_FROM_EMAIL:}
app.mail.from-name=${MAIL_FROM_NAME:MultiTenant SaaS}
app.mail.brevo.api-key=${BREVO_API_KEY:}
app.mail.brevo.base-url=${BREVO_BASE_URL:https://api.brevo.com/v3}
