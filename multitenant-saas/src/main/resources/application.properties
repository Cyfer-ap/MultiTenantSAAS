spring.application.name=multitenant-saas

server.port=${SERVER_PORT:8081}
server.shutdown=graceful
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:NONE}
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:20s}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/common
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false

# H2 console must remain disabled unless a local profile enables it
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.jwt.issuer=${JWT_ISSUER:multitenant-saas}

# Refresh tokens
# Session refresh credentials disappear when the browser closes.
app.refresh-token.session-expiration-hours=${REFRESH_TOKEN_SESSION_EXPIRATION_HOURS:12}
# Persistent refresh credentials are used only when "Keep me signed in" is selected.
app.refresh-token.persistent-expiration-days=${REFRESH_TOKEN_PERSISTENT_EXPIRATION_DAYS:30}

# Browser session cookies
app.auth.browser-session.cookie-mode=${AUTH_BROWSER_COOKIE_MODE:true}
app.auth.browser-session.secure=${AUTH_COOKIE_SECURE:false}
app.auth.browser-session.partitioned=${AUTH_COOKIE_PARTITIONED:false}
app.auth.browser-session.same-site=${AUTH_COOKIE_SAME_SITE:Lax}

# Password reset
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:15}
app.password-reset.expose-token=${PASSWORD_RESET_EXPOSE_TOKEN:false}
app.password-reset.frontend-base-url=${PASSWORD_RESET_FRONTEND_BASE_URL:http://localhost:8080}

# System-admin bootstrap
app.system-admin.bootstrap.enabled=${SYSTEM_ADMIN_BOOTSTRAP_ENABLED:false}
app.system-admin.bootstrap.full-name=${SYSTEM_ADMIN_BOOTSTRAP_FULL_NAME:}
app.system-admin.bootstrap.email=${SYSTEM_ADMIN_BOOTSTRAP_EMAIL:}
app.system-admin.bootstrap.password=${SYSTEM_ADMIN_BOOTSTRAP_PASSWORD:}

# Login security
app.security.max-failed-login-attempts=${MAX_FAILED_LOGIN_ATTEMPTS:5}
app.security.account-lock-minutes=${ACCOUNT_LOCK_MINUTES:15}

# Email-first workspace discovery
# A dedicated secret is recommended in production. JWT_SECRET is a safe deployment fallback.
app.auth.email-verification.expiration-minutes=${EMAIL_VERIFICATION_EXPIRATION_MINUTES:10}
app.auth.email-verification.max-attempts=${EMAIL_VERIFICATION_MAX_ATTEMPTS:5}
app.auth.email-verification.trusted-browser-days=${EMAIL_VERIFICATION_TRUSTED_BROWSER_DAYS:30}
app.auth.email-verification.secret=${EMAIL_VERIFICATION_SECRET:${JWT_SECRET}}

# Public authentication abuse protection. This limiter is process-local;
# use a shared store when the application is horizontally scaled.
app.security.public-rate-limit.enabled=${PUBLIC_RATE_LIMIT_ENABLED:true}
app.security.public-rate-limit.window-seconds=${PUBLIC_RATE_LIMIT_WINDOW_SECONDS:60}
app.security.public-rate-limit.login-max-requests=${PUBLIC_RATE_LIMIT_LOGIN_MAX_REQUESTS:30}
app.security.public-rate-limit.recovery-max-requests=${PUBLIC_RATE_LIMIT_RECOVERY_MAX_REQUESTS:10}
app.security.public-rate-limit.token-max-requests=${PUBLIC_RATE_LIMIT_TOKEN_MAX_REQUESTS:120}
app.security.public-rate-limit.onboarding-max-requests=${PUBLIC_RATE_LIMIT_ONBOARDING_MAX_REQUESTS:10}

# Invitations
app.user-invitation.expiration-hours=${USER_INVITATION_EXPIRATION_HOURS:48}

# Transactional email
# Keep logging as the safe default for local development and automated tests.
app.mail.provider=${MAIL_PROVIDER:logging}
app.mail.from-email=${MAIL_FROM_EMAIL:}
app.mail.from-name=${MAIL_FROM_NAME:MultiTenant SaaS}
app.mail.brevo.api-key=${BREVO_API_KEY:}
app.mail.brevo.base-url=${BREVO_BASE_URL:https://api.brevo.com/v3}

# Durable notification delivery. Enable after at least one channel handler is configured.
app.notifications.delivery.enabled=${NOTIFICATION_DELIVERY_ENABLED:false}
app.notifications.delivery.batch-size=${NOTIFICATION_DELIVERY_BATCH_SIZE:50}
app.notifications.delivery.max-attempts=${NOTIFICATION_DELIVERY_MAX_ATTEMPTS:5}
app.notifications.delivery.processing-timeout=${NOTIFICATION_DELIVERY_PROCESSING_TIMEOUT:5m}
app.notifications.delivery.retry-base-delay=${NOTIFICATION_DELIVERY_RETRY_BASE_DELAY:30s}
app.notifications.delivery.retry-max-delay=${NOTIFICATION_DELIVERY_RETRY_MAX_DELAY:1h}
app.notifications.email.frontend-base-url=${NOTIFICATION_FRONTEND_BASE_URL:http://localhost:8080}

# Object storage
# Disabled by default so tests and local development do not require cloud credentials.
app.storage.provider=${STORAGE_PROVIDER:disabled}
app.storage.r2.endpoint=${R2_ENDPOINT:}
app.storage.r2.bucket=${R2_BUCKET:}
app.storage.r2.region=${R2_REGION:auto}
app.storage.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.storage.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.storage.r2.upload-url-expiration-minutes=${R2_UPLOAD_URL_EXPIRATION_MINUTES:10}
app.storage.r2.download-url-expiration-minutes=${R2_DOWNLOAD_URL_EXPIRATION_MINUTES:5}

# Billing providers remain unavailable through checkout until explicitly enabled.
# Stripe billing
# Disabled by default so local development and CI do not require payment credentials.
app.billing.stripe.enabled=${STRIPE_BILLING_ENABLED:false}
app.billing.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.billing.stripe.base-url=${STRIPE_BASE_URL:https://api.stripe.com}
app.billing.stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:8080/settings/billing?checkout=success}
app.billing.stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:8080/settings/billing?checkout=cancelled}
# Webhook ingestion stays disabled until the endpoint secret is configured.
app.billing.stripe.webhook-enabled=${STRIPE_WEBHOOK_ENABLED:false}
app.billing.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.billing.stripe.webhook-tolerance-seconds=${STRIPE_WEBHOOK_TOLERANCE_SECONDS:300}
# Price IDs below must reference recurring Stripe Prices.
app.billing.stripe.prices.free=${STRIPE_PRICE_FREE:}
app.billing.stripe.prices.pro=${STRIPE_PRICE_PRO:}
app.billing.stripe.prices.enterprise=${STRIPE_PRICE_ENTERPRISE:}

# Razorpay billing
# Disabled by default so local development and CI do not require payment credentials.
app.billing.razorpay.enabled=${RAZORPAY_BILLING_ENABLED:false}
app.billing.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.billing.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.billing.razorpay.base-url=${RAZORPAY_BASE_URL:https://api.razorpay.com}
# Webhook ingestion stays disabled until the endpoint secret is configured.
app.billing.razorpay.webhook-enabled=${RAZORPAY_WEBHOOK_ENABLED:false}
app.billing.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
# This bounds the subscription as required by the Razorpay API.
app.billing.razorpay.total-count=${RAZORPAY_SUBSCRIPTION_TOTAL_COUNT:120}
# Plan IDs below must reference Razorpay subscription Plans.
app.billing.razorpay.plans.free=${RAZORPAY_PLAN_FREE:}
app.billing.razorpay.plans.pro=${RAZORPAY_PLAN_PRO:}
app.billing.razorpay.plans.enterprise=${RAZORPAY_PLAN_ENTERPRISE:}
